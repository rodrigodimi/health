<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F4F1EC;
  --surface: #FFFFFF;
  --surface2: #EDEAE5;
  --text: #111110;
  --muted: #888480;
  --border: #DEDAD4;

  --trabalho: #0B4279;
  --trabalho-light: #EAF1F8;
  --saude: #00A88E;
  --saude-light: #E5F6F3;
  --pessoal: #7B5EA7;
  --pessoal-light: #F2EDF9;

  --urgente: #C61F40;
  --urgente-light: #FAE9ED;
  --normal: #C48A00;
  --normal-light: #FBF4E0;
  --depois: #888480;
  --depois-light: #F4F3F1;

  --alert-bg: #FFF7ED;
  --alert-border: #F59E0B;
  --alert-text: #92400E;
  --alert-overdue-bg: #FEF2F2;
  --alert-overdue-border: #C61F40;
  --alert-overdue-text: #7F1D1D;

  --r: 10px;
  --shadow: 0 1px 10px rgba(17,17,16,0.07);

  --fs-xs:  0.66rem;
  --fs-sm:  0.74rem;
  --fs-base:0.83rem;
  --fs-md:  0.9rem;
  --fs-lg:  1rem;
}

html { font-size: 16px; }

body {
  font-family: 'Geist', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ── HEADER ─────────────────────────────── */
header {
  background: var(--text);
  padding: 18px 20px 16px;
  padding-top: max(18px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left h1 {
  font-size: 1.1rem;
  font-weight: 600;
  color: #F4F1EC;
  letter-spacing: -0.3px;
  line-height: 1;
}

.header-left h1 span {
  color: #E4AB00;
  font-weight: 300;
  font-style: italic;
}

.header-date {
  font-size: var(--fs-xs);
  color: #666360;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 3px;
}

.header-stats {
  display: flex;
  gap: 18px;
  align-items: center;
}

.stat { text-align: right; }

.stat-number {
  font-size: 1.3rem;
  font-weight: 600;
  color: #F4F1EC;
  letter-spacing: -0.5px;
  line-height: 1;
}

.stat-label {
  font-size: 0.58rem;
  color: #666360;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.stat-div {
  width: 1px;
  height: 24px;
  background: #2A2A28;
}

/* ── ADD BTN (mobile FAB) ─────────────── */
.fab {
  display: none;
  position: fixed;
  bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
  right: max(20px, calc(env(safe-area-inset-right) + 16px));
  z-index: 200;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--text);
  color: #F4F1EC;
  border: none;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(17,17,16,0.22);
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}

.fab:active { transform: scale(0.93); }

/* ── MOBILE DRAWER ────────────────────── */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17,17,16,0.45);
  z-index: 150;
  opacity: 0;
  transition: opacity 0.2s;
}

.drawer-overlay.open { opacity: 1; }

.drawer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  padding: 0 18px 28px;
  z-index: 160;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.32,.72,0,1);
  max-height: 92dvh;
  overflow-y: auto;
}

.drawer.open { transform: translateY(0); }

.drawer-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 16px;
}

/* ── MAIN LAYOUT ─────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 284px 1fr;
  min-height: calc(100vh - 68px);
  min-height: calc(100dvh - 68px);
}

/* ── SIDEBAR ─────────────────────────── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
}

.section-title {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 600;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-label {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

input[type="text"],
textarea,
select {
  font-family: 'Geist', sans-serif;
  font-size: var(--fs-sm);
  border: 1.5px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  width: 100%;
  transition: border-color 0.12s, background 0.12s;
  -webkit-appearance: none;
}

input[type="text"]:focus,
textarea:focus {
  border-color: var(--text);
  background: #fff;
}

textarea {
  resize: vertical;
  min-height: 58px;
}

/* CAT */
.cat-toggle {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 5px;
}

.cat-btn {
  padding: 7px 4px;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  cursor: pointer;
  font-family: 'Geist', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.cat-btn.active[data-cat="trabalho"] { background: var(--trabalho-light); border-color: var(--trabalho); color: var(--trabalho); }
.cat-btn.active[data-cat="saude"]    { background: var(--saude-light);    border-color: var(--saude);    color: var(--saude);    }
.cat-btn.active[data-cat="pessoal"]  { background: var(--pessoal-light);  border-color: var(--pessoal);  color: var(--pessoal);  }

.cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
[data-cat="trabalho"] .cat-dot { background: var(--trabalho); }
[data-cat="saude"]    .cat-dot { background: var(--saude);    }
[data-cat="pessoal"]  .cat-dot { background: var(--pessoal);  }

/* SUBCAT */
.subcat-wrap {
  overflow: hidden;
  max-height: 80px;
  transition: max-height 0.2s ease, opacity 0.15s;
  opacity: 1;
}

.subcat-wrap.hidden {
  max-height: 0;
  opacity: 0;
  pointer-events: none;
}

/* PRIO */
.prio-toggle {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 5px;
}

.prio-btn {
  padding: 7px 4px;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  cursor: pointer;
  font-family: 'Geist', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--muted);
  transition: all 0.12s;
  text-align: center;
}

.prio-btn.active[data-prio="urgente"] { background: var(--urgente-light); border-color: var(--urgente); color: var(--urgente); }
.prio-btn.active[data-prio="normal"]  { background: var(--normal-light);  border-color: var(--normal);  color: var(--normal);  }
.prio-btn.active[data-prio="depois"]  { background: var(--depois-light);  border-color: var(--depois);  color: #5A5652;        }

.btn-add {
  background: var(--text);
  color: #F4F1EC;
  border: none;
  border-radius: 8px;
  padding: 11px;
  font-family: 'Geist', sans-serif;
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.12s, transform 0.1s;
  width: 100%;
  touch-action: manipulation;
}

.btn-add:hover  { opacity: 0.82; }
.btn-add:active { transform: scale(0.98); }

.progress-wrap { display: flex; flex-direction: column; gap: 4px; }

.progress-bg {
  background: var(--surface2);
  border-radius: 3px;
  height: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--text);
  border-radius: 3px;
  transition: width 0.35s ease;
}

.progress-label {
  font-size: var(--fs-xs);
  color: var(--muted);
}

/* ── CONTENT ─────────────────────────── */
.content {
  padding: 18px 24px 80px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

.content-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.content-header h2 {
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: -0.1px;
}

.filters {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.filter-chip {
  padding: 4px 10px;
  border-radius: 20px;
  font-family: 'Geist', sans-serif;
  font-size: var(--fs-xs);
  font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
  touch-action: manipulation;
}

.filter-chip.active { background: var(--text); border-color: var(--text); color: #F4F1EC; }

/* ── ALERT BANNER ────────────────────── */
.alert-banner {
  border-radius: var(--r);
  padding: 10px 13px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: var(--fs-sm);
  line-height: 1.45;
  animation: fadeUp 0.2s ease;
}

.alert-banner.overdue {
  background: var(--alert-overdue-bg);
  border: 1.5px solid var(--alert-overdue-border);
  color: var(--alert-overdue-text);
}

.alert-banner.warning {
  background: var(--alert-bg);
  border: 1.5px solid var(--alert-border);
  color: var(--alert-text);
}

.alert-icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }

.alert-content { flex: 1; }

.alert-title {
  font-weight: 600;
  font-size: var(--fs-sm);
  display: block;
  margin-bottom: 2px;
}

.alert-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.alert-list li {
  font-size: var(--fs-xs);
  opacity: 0.9;
}

/* ── TASK GROUPS ─────────────────────── */
.task-groups {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.group-label {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.group-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.group-label.urgente { color: var(--urgente); }
.group-label.normal  { color: var(--normal);  }
.group-label.depois  { color: var(--depois);  }

/* ── TASK CARD ───────────────────────── */
.task-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  align-items: start;
}

@media (max-width: 1100px) {
  .task-list { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .task-list { grid-template-columns: 1fr; }
}

.task-card {
  border-radius: var(--r);
  border: 1.5px solid transparent;
  padding: 8px 10px 8px 13px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.2s ease;
  transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
}

/* priority backgrounds */
.task-card[data-prio="urgente"] {
  background: #FEF5F7;
  border-color: #F5C5CF;
}
.task-card[data-prio="normal"] {
  background: #FEFBF0;
  border-color: #EFD98A;
}
.task-card[data-prio="depois"] {
  background: #F8F8F6;
  border-color: #DEDAD4;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.task-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}

.task-card[data-cat="trabalho"]::before { background: var(--trabalho); }
.task-card[data-cat="saude"]::before    { background: var(--saude);    }
.task-card[data-cat="pessoal"]::before  { background: var(--pessoal);  }

.task-card:hover { box-shadow: var(--shadow); }

/* overdue ring overrides background */
.task-card.overdue  { border-color: var(--urgente) !important; }

/* drag */
.task-card.dragging {
  opacity: 0.32;
  box-shadow: none;
  border-style: dashed;
}

.task-card.drag-over {
  box-shadow: 0 0 0 2px rgba(17,17,16,0.15);
  transform: scale(1.01);
}

.drag-handle {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding: 3px 2px;
  cursor: grab;
  opacity: 0.18;
  transition: opacity 0.12s;
  touch-action: none;
  margin-top: 1px;
  align-self: flex-start;
}

.drag-handle:hover  { opacity: 0.5; }
.drag-handle:active { cursor: grabbing; opacity: 0.7; }

.drag-handle span {
  display: block;
  width: 11px;
  height: 1.5px;
  background: var(--text);
  border-radius: 2px;
}

.task-card.done .drag-handle { opacity: 0.08; pointer-events: none; }

.drop-line {
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  margin: 1px 4px;
  opacity: 0;
  transition: opacity 0.1s;
  pointer-events: none;
}

.drop-line.show { opacity: 1; }

.task-card.done {
  opacity: 0.38;
  background: #F9F9F7 !important;
  border-color: #E5E2DC !important;
}

.task-card.done .task-title { text-decoration: line-through; }

/* checkbox */
.task-check {
  flex-shrink: 0;
  width: 16px; height: 16px;
  border: 1.5px solid #C8C4BE;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
  touch-action: manipulation;
  background: rgba(255,255,255,0.6);
}

.task-check:hover { border-color: var(--text); }

.task-check.checked {
  background: var(--text);
  border-color: var(--text);
}

.task-check.checked::after {
  content: '';
  display: block;
  width: 3px; height: 6px;
  border: 1.5px solid #F4F1EC;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-0.5px,-1px);
}

.task-body { flex: 1; min-width: 0; }

.task-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
  flex-wrap: wrap;
}

.tag {
  font-size: 0.54rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1px 4px;
  border-radius: 3px;
}

.tag.trabalho { background: var(--trabalho-light); color: var(--trabalho); }
.tag.saude    { background: var(--saude-light);    color: var(--saude);    }
.tag.pessoal  { background: var(--pessoal-light);  color: var(--pessoal);  }
.tag.subcat   { background: rgba(0,0,0,0.06); color: var(--muted); font-weight: 500; }

/* overdue badge on card */
.overdue-badge {
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
}

.overdue-badge.red    { background: var(--urgente-light); color: var(--urgente); }
.overdue-badge.yellow { background: var(--normal-light);  color: var(--normal);  }

.task-title {
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}

.task-desc {
  font-size: 0.58rem;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.4;
}

.task-dates {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.task-date {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 0.54rem;
  color: #BBBBBB;
}

.task-date.done-date { color: var(--saude); }

.task-date svg { opacity: 0.5; flex-shrink: 0; }
.task-date.done-date svg { opacity: 0.8; }

/* ── CHECKLIST INSIDE CARD ───────────── */
.card-checklist {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.card-checklist-progress {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 4px;
}

.cl-bar-bg {
  flex: 1;
  height: 2px;
  background: rgba(0,0,0,0.1);
  border-radius: 2px;
  overflow: hidden;
}

.cl-bar-fill {
  height: 100%;
  background: var(--saude);
  border-radius: 2px;
  transition: width 0.25s ease;
}

.cl-count {
  font-size: 0.56rem;
  color: var(--muted);
  white-space: nowrap;
}

.cl-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.62rem;
  color: var(--text);
  line-height: 1.3;
}

.cl-item input[type="checkbox"] {
  width: 12px; height: 12px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: var(--text);
  border-radius: 3px;
  margin: 0;
  padding: 0;
  border: none;
  background: none;
  outline: none;
  width: auto;
}

.cl-item span {
  flex: 1;
}

.cl-item.cl-done span {
  text-decoration: line-through;
  opacity: 0.45;
}

.task-delete {
  flex-shrink: 0;
  background: none;
  border: none;
  cursor: pointer;
  color: #C8C4BE;
  font-size: 0.72rem;
  padding: 2px 3px;
  border-radius: 4px;
  transition: color 0.12s;
  line-height: 1;
  margin-top: 1px;
  touch-action: manipulation;
}

.task-delete:hover { color: var(--urgente); }

/* empty */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}

.empty-icon { font-size: 1.6rem; margin-bottom: 8px; opacity: 0.3; }
.empty-state p { font-size: var(--fs-sm); }

/* ── EDIT BUTTON ON CARD ─────────────── */
.task-actions {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
}

.task-edit {
  flex-shrink: 0;
  background: none;
  border: none;
  cursor: pointer;
  color: #C8C4BE;
  font-size: 0.72rem;
  padding: 2px 3px;
  border-radius: 4px;
  transition: color 0.12s;
  line-height: 1;
  margin-top: 1px;
  touch-action: manipulation;
}

.task-edit:hover { color: var(--normal); }

/* ── SYNC BUTTONS ────────────────────── */
.header-sync {
  display: flex;
  gap: 6px;
  align-items: center;
}

.btn-sync {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: #C8C4BE;
  border-radius: 7px;
  padding: 5px 10px;
  font-family: 'Geist', sans-serif;
  font-size: 0.66rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
  touch-action: manipulation;
}

.btn-sync:hover { background: rgba(255,255,255,0.15); color: #F4F1EC; }

.btn-sync.import { color: #7EC8B8; border-color: rgba(126,200,184,0.25); }
.btn-sync.import:hover { background: rgba(126,200,184,0.12); }

/* sync toast */
.sync-toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: var(--text);
  color: #F4F1EC;
  font-size: 0.72rem;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 20px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  white-space: nowrap;
}

.sync-toast.show { opacity: 1; }

/* import confirm modal */
.import-modal {
  background: var(--surface);
  border-radius: 14px;
  padding: 20px 18px;
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 8px 40px rgba(17,17,16,0.18);
  animation: modalIn 0.2s cubic-bezier(.32,.72,0,1);
}

.import-modal h3 {
  font-size: 0.82rem;
  font-weight: 600;
}

.import-modal p {
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.5;
}

.import-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17,17,16,0.5);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: 14px;
  padding: 20px 18px 16px;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  box-shadow: 0 8px 40px rgba(17,17,16,0.18);
  animation: modalIn 0.2s cubic-bezier(.32,.72,0,1);
  font-size: var(--fs-sm);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.85rem;
  padding: 2px 5px;
  border-radius: 5px;
  transition: color 0.12s;
}

.modal-close:hover { color: var(--urgente); }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.btn-save {
  background: var(--text);
  color: #F4F1EC;
  border: none;
  border-radius: 7px;
  padding: 7px 16px;
  font-family: 'Geist', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.12s;
}

.btn-save:hover { opacity: 0.82; }

.btn-cancel {
  background: var(--surface2);
  color: var(--muted);
  border: none;
  border-radius: 7px;
  padding: 7px 12px;
  font-family: 'Geist', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s;
}

.btn-cancel:hover { background: var(--border); }

/* modal form elements smaller */
.modal .form-label { font-size: 0.6rem; }
.modal input[type="text"],
.modal textarea { font-size: 0.72rem; padding: 6px 9px; }
.modal .cat-btn,
.modal .prio-btn { font-size: 0.66rem; padding: 6px 4px; }
.modal .cl-edit-item { font-size: 0.7rem; }

/* checklist editor in modal */
.cl-edit-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
}

.cl-edit-item input[type="checkbox"] {
  width: 13px; height: 13px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: var(--text);
  padding: 0; border: none; background: none; outline: none; width: auto;
}

.cl-edit-item span {
  flex: 1;
  font-size: var(--fs-sm);
  color: var(--text);
}

.cl-edit-item .cl-del {
  background: none;
  border: none;
  cursor: pointer;
  color: #C8C4BE;
  font-size: 0.72rem;
  padding: 1px 3px;
  border-radius: 3px;
  transition: color 0.1s;
}

.cl-edit-item .cl-del:hover { color: var(--urgente); }
@media (max-width: 680px) {
  header {
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    gap: 6px;
    flex-wrap: wrap;
  }

  .header-left {
    flex: 1 1 100%;
  }

  .header-left h1 { font-size: 0.95rem; }
  .header-date { display: none; }

  .header-stats { display: none; }

  .header-sync {
    flex: 1 1 100%;
    gap: 6px;
  }

  .btn-sync {
    flex: 1;
    justify-content: center;
    font-size: 0.66rem;
    padding: 7px 8px;
  }

  .layout { grid-template-columns: 1fr; }

  .sidebar { display: none; }

  .fab { display: flex; }

  .drawer-overlay { display: block; }

  .content { padding: 14px 14px 90px; }

  .content-header { gap: 8px; }

  .filters { gap: 4px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }

  .task-card { padding: 10px 11px 10px 14px; }

  .task-check { width: 20px; height: 20px; }
}

@media (min-width: 681px) {
  .drawer, .drawer-overlay { display: none !important; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <h1>ToDo<span>Dimi</span></h1>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-number" id="statPending">0</div>
      <div class="stat-label">pendentes</div>
    </div>
    <div class="stat-div"></div>
    <div class="stat">
      <div class="stat-number" id="statDone">0</div>
      <div class="stat-label">concluídas</div>
    </div>
  </div>
  <div class="header-sync">
    <button class="btn-sync" onclick="exportData()" title="Exportar tarefas">&#8593; exportar</button>
    <button class="btn-sync import" onclick="triggerImport()" title="Importar tarefas">&#8595; importar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>

<!-- FAB (mobile only) -->
<button class="fab" id="fabBtn" aria-label="Nova tarefa">+</button>

<!-- DRAWER OVERLAY (mobile) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER (mobile) -->
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div id="drawerForm"></div>
</div>

<!-- MAIN -->
<div class="layout">

  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar" id="sidebarForm"></aside>

  <!-- CONTENT -->
  <main class="content">
    <div class="content-header">
      <h2>Tarefas</h2>
      <div class="filters" id="filters">
        <button class="filter-chip active" data-filter="all"      onclick="setFilter('all')">Todas</button>
        <button class="filter-chip"        data-filter="trabalho" onclick="setFilter('trabalho')">Trabalho</button>
        <button class="filter-chip"        data-filter="saude"    onclick="setFilter('saude')">Saúde</button>
        <button class="filter-chip"        data-filter="pessoal"  onclick="setFilter('pessoal')">Pessoal</button>
        <button class="filter-chip"        data-filter="urgente"  onclick="setFilter('urgente')">Urgente</button>
        <button class="filter-chip"        data-filter="done"     onclick="setFilter('done')">Concluídas</button>
      </div>
    </div>
    <div id="alertContainer"></div>
    <div id="taskContainer"></div>
  </main>
</div>

<!-- TOAST -->
<div class="sync-toast" id="syncToast"></div>

<!-- IMPORT CONFIRM MODAL -->
<div class="modal-overlay" id="importModal">
  <div class="import-modal">
    <h3>Importar tarefas</h3>
    <p id="importModalDesc"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeImportModal()">Cancelar</button>
      <button class="btn-cancel" style="background:var(--normal-light);color:var(--normal)" id="importMergeBtn" onclick="confirmImport('merge')">Mesclar</button>
      <button class="btn-save" id="importReplaceBtn" onclick="confirmImport('replace')">Substituir</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Editar tarefa</div>
      <button class="modal-close" onclick="closeEdit()">&#x2715;</button>
    </div>

    <div class="form-group">
      <div class="form-label">Categoria</div>
      <div class="cat-toggle">
        <button class="cat-btn" data-cat="trabalho" onclick="editSelectCat('trabalho')"><span class="cat-dot"></span>Trabalho</button>
        <button class="cat-btn" data-cat="saude"    onclick="editSelectCat('saude')"><span class="cat-dot"></span>Saúde</button>
        <button class="cat-btn" data-cat="pessoal"  onclick="editSelectCat('pessoal')"><span class="cat-dot"></span>Pessoal</button>
      </div>
    </div>

    <div class="form-group subcat-wrap" id="editSubcatWrap">
      <div class="form-label" id="editSubcatLabel">Subcategoria</div>
      <input type="text" id="editSubcat" placeholder="">
    </div>

    <div class="form-group">
      <div class="form-label">Prioridade</div>
      <div class="prio-toggle">
        <button class="prio-btn" data-prio="urgente" onclick="editSelectPrio('urgente')">Urgente</button>
        <button class="prio-btn" data-prio="normal"  onclick="editSelectPrio('normal')">Normal</button>
        <button class="prio-btn" data-prio="depois"  onclick="editSelectPrio('depois')">Depois</button>
      </div>
    </div>

    <div class="form-group">
      <div class="form-label">Título</div>
      <input type="text" id="editTitle" placeholder="Título da tarefa">
    </div>

    <div class="form-group">
      <div class="form-label">Detalhe</div>
      <textarea id="editDesc" placeholder="Contexto, links, observações..."></textarea>
    </div>

    <div class="form-group">
      <div class="form-label">Subtarefas</div>
      <div id="editChecklist" style="display:flex;flex-direction:column;gap:5px;margin-bottom:4px;"></div>
      <div style="display:flex;gap:6px;">
        <input type="text" id="editClInput" placeholder="Nova subtarefa..." style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addEditClItem();}">
        <button type="button" class="btn-cancel" style="padding:6px 10px;font-size:0.72rem;" onclick="addEditClItem()">+ Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEdit()">Cancelar</button>
      <button class="btn-save"   onclick="saveEdit()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────
let tasks = JSON.parse(localStorage.getItem('agenda_v3') || '[]');
let selCat  = 'trabalho';
let selPrio = 'urgente';
let filter  = 'all';

// ── DATE HELPERS ──────────────────────
const DAYS   = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const now = new Date();
document.getElementById('headerDate').textContent =
  `${DAYS[now.getDay()]}, ${now.getDate()} de ${MONTHS[now.getMonth()]} de ${now.getFullYear()}`;

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Human-friendly "created X ago" for the card
function ageLabel(iso) {
  const ms   = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(ms / 60000);
  const hrs  = Math.floor(ms / 3600000);
  const days = Math.floor(ms / 86400000);
  if (mins < 2)   return 'agora mesmo';
  if (mins < 60)  return `há ${mins} min`;
  if (hrs  < 24)  return `há ${hrs}h`;
  if (days === 1) return 'há 1 dia';
  return `há ${days} dias`;
}

// Business days (Mon–Fri) elapsed since creation
function businessDaysSince(iso) {
  const start = new Date(iso);
  start.setHours(0,0,0,0);
  const end = new Date();
  end.setHours(0,0,0,0);
  let count = 0;
  const cur = new Date(start);
  while (cur < end) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

const OVERDUE_BDAYS = { urgente: 3, normal: 5, depois: null };

function overdueStatus(t) {
  if (t.done) return null;
  const limit = OVERDUE_BDAYS[t.prio];
  if (limit === null) return null;
  return businessDaysSince(t.createdAt) >= limit ? 'overdue' : null;
}


// ── FORM HTML ─────────────────────────
const subcatPH = {
  trabalho: 'ex: CRZLabs, PI Planning, CAPEX...',
  saude:    'ex: Nutrição, Treino, Consulta...',
  pessoal:  null
};

function formHTML(prefix) {
  return `
  <div class="section-title">Nova tarefa</div>

  <div class="form-group" style="margin-top:12px">
    <div class="form-label">Categoria</div>
    <div class="cat-toggle">
      <button class="cat-btn active" data-cat="trabalho" onclick="selectCat('trabalho','${prefix}')"><span class="cat-dot"></span>Trabalho</button>
      <button class="cat-btn"        data-cat="saude"    onclick="selectCat('saude','${prefix}')"><span class="cat-dot"></span>Saúde</button>
      <button class="cat-btn"        data-cat="pessoal"  onclick="selectCat('pessoal','${prefix}')"><span class="cat-dot"></span>Pessoal</button>
    </div>
  </div>

  <div class="form-group subcat-wrap" id="${prefix}SubcatWrap" style="margin-top:10px">
    <div class="form-label" id="${prefix}SubcatLabel">Subcategoria de Trabalho</div>
    <input type="text" id="${prefix}Subcat" placeholder="${subcatPH.trabalho}">
  </div>

  <div class="form-group" style="margin-top:10px">
    <div class="form-label">Prioridade</div>
    <div class="prio-toggle">
      <button class="prio-btn active" data-prio="urgente" onclick="selectPrio('urgente','${prefix}')">Urgente</button>
      <button class="prio-btn"        data-prio="normal"  onclick="selectPrio('normal','${prefix}')">Normal</button>
      <button class="prio-btn"        data-prio="depois"  onclick="selectPrio('depois','${prefix}')">Depois</button>
    </div>
  </div>

  <div class="form-group" style="margin-top:10px">
    <div class="form-label">Título</div>
    <input type="text" id="${prefix}Title" placeholder="O que precisa ser feito?" onkeydown="if(event.key==='Enter')addTask()">
  </div>

  <div class="form-group" style="margin-top:10px">
    <div class="form-label">Detalhe (opcional)</div>
    <textarea id="${prefix}Desc" placeholder="Contexto, links, observações..."></textarea>
  </div>

  <button class="btn-add" style="margin-top:12px" onclick="addTask()">Adicionar tarefa</button>

  <div class="progress-wrap" style="margin-top:14px">
    <div class="progress-label" id="${prefix}ProgressLabel">0 de 0 concluídas</div>
    <div class="progress-bg"><div class="progress-fill" id="${prefix}ProgressFill" style="width:0%"></div></div>
  </div>`;
}

document.getElementById('sidebarForm').innerHTML = formHTML('sb');
document.getElementById('drawerForm').innerHTML  = formHTML('dr');

// ── FORM INTERACTIONS ─────────────────
function activePrefix() {
  return window.innerWidth <= 680 ? 'dr' : 'sb';
}

function selectCat(cat, prefix) {
  selCat = cat;
  ['sb','dr'].forEach(p => {
    document.querySelectorAll(`#${p === 'sb' ? 'sidebarForm' : 'drawerForm'} .cat-btn`).forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`#${p === 'sb' ? 'sidebarForm' : 'drawerForm'} .cat-btn[data-cat="${cat}"]`);
    if (btn) btn.classList.add('active');

    const wrap  = document.getElementById(`${p}SubcatWrap`);
    const input = document.getElementById(`${p}Subcat`);
    const label = document.getElementById(`${p}SubcatLabel`);
    const ph    = subcatPH[cat];

    if (ph !== null) {
      wrap.classList.remove('hidden');
      input.placeholder = ph;
      label.textContent = cat === 'trabalho' ? 'Subcategoria de Trabalho' : 'Subcategoria de Saúde';
    } else {
      wrap.classList.add('hidden');
      input.value = '';
    }
  });
}

function selectPrio(prio, prefix) {
  selPrio = prio;
  ['sb','dr'].forEach(p => {
    document.querySelectorAll(`#${p === 'sb' ? 'sidebarForm' : 'drawerForm'} .prio-btn`).forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`#${p === 'sb' ? 'sidebarForm' : 'drawerForm'} .prio-btn[data-prio="${prio}"]`);
    if (btn) btn.classList.add('active');
  });
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-chip[data-filter="${f}"]`).classList.add('active');
  render();
}

// ── DRAWER ────────────────────────────
document.getElementById('fabBtn').addEventListener('click', () => {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerOverlay').style.display = 'block';
  setTimeout(() => document.getElementById('drTitle').focus(), 300);
});

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ── CRUD ──────────────────────────────
function addTask() {
  const p     = activePrefix();
  const title = document.getElementById(`${p}Title`).value.trim();
  if (!title) {
    const el = document.getElementById(`${p}Title`);
    el.focus();
    el.style.borderColor = 'var(--urgente)';
    setTimeout(() => el.style.borderColor = '', 1200);
    return;
  }
  tasks.unshift({
    id: Date.now(),
    title,
    desc:        document.getElementById(`${p}Desc`).value.trim(),
    cat:         selCat,
    subcat:      document.getElementById(`${p}Subcat`).value.trim() || null,
    prio:        selPrio,
    done:        false,
    createdAt:   new Date().toISOString(),
    completedAt: null
  });
  document.getElementById(`${p}Title`).value  = '';
  document.getElementById(`${p}Desc`).value   = '';
  document.getElementById(`${p}Subcat`).value = '';
  closeDrawer();
  save(); render();
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? new Date().toISOString() : null;
  save(); render();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); render();
}

function save() {
  localStorage.setItem('agenda_v3', JSON.stringify(tasks));
}

// ── ICONS ─────────────────────────────
const iCal   = `<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 5h10" stroke="currentColor" stroke-width="1.2"/><path d="M4 1v2M8 1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`;
const iCheck = `<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 6l1.5 1.5L8 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const catLabel = { trabalho:'Trabalho', saude:'Saúde', pessoal:'Pessoal' };

// ── CARD ──────────────────────────────
function taskCard(t) {
  const status  = overdueStatus(t);
  const cardCls = ['task-card', t.done ? 'done' : '', status || ''].filter(Boolean).join(' ');

  const badge = (!t.done && status === 'overdue')
    ? `<span class="overdue-badge red">+${OVERDUE_BDAYS[t.prio]}d útil${OVERDUE_BDAYS[t.prio] > 1 ? 'eis' : ''}</span>`
    : '';

  // checklist
  const items = t.checklist || [];
  let checklistHtml = '';
  if (items.length) {
    const done  = items.filter(i => i.done).length;
    const pct   = Math.round((done / items.length) * 100);
    const rows  = items.map((item, idx) =>
      `<label class="cl-item ${item.done ? 'cl-done' : ''}">
        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleClItem(${t.id},${idx},this.checked)" onclick="event.stopPropagation()">
        <span>${escHtml(item.text)}</span>
      </label>`
    ).join('');
    checklistHtml = `<div class="card-checklist">
      <div class="card-checklist-progress">
        <div class="cl-bar-bg"><div class="cl-bar-fill" style="width:${pct}%"></div></div>
        <span class="cl-count">${done}/${items.length}</span>
      </div>
      ${rows}
    </div>`;
  }

  return `<div class="${cardCls}" data-cat="${t.cat}" data-id="${t.id}" data-prio="${t.prio}">
    <div class="drag-handle" title="Arrastar para reordenar"><span></span><span></span><span></span><span></span></div>
    <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone(${t.id})"></div>
    <div class="task-body">
      <div class="task-meta">
        <span class="tag ${t.cat}">${catLabel[t.cat]}</span>
        ${t.subcat ? `<span class="tag subcat">${escHtml(t.subcat)}</span>` : ''}
        ${badge}
      </div>
      <div class="task-title">${escHtml(t.title)}</div>
      ${t.desc ? `<div class="task-desc">${escHtml(t.desc)}</div>` : ''}
      ${checklistHtml}
      <div class="task-dates">
        <span class="task-date">${iCal} ${ageLabel(t.createdAt)}</span>
        ${t.completedAt ? `<span class="task-date done-date">${iCheck} Concluída ${fmtDate(t.completedAt)}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      <button class="task-edit"   onclick="openEdit(${t.id})"   title="Editar">&#9998;</button>
      <button class="task-delete" onclick="deleteTask(${t.id})" title="Remover">&#x2715;</button>
    </div>
  </div>`;
}

function toggleClItem(taskId, idx, checked) {
  const t = tasks.find(t => t.id === taskId);
  if (t && t.checklist && t.checklist[idx] !== undefined) {
    t.checklist[idx].done = checked;
    save();
    // re-render only the checklist portion without full render
    const card = document.querySelector(`.task-card[data-id="${taskId}"]`);
    if (card) {
      const newCard = document.createElement('div');
      newCard.innerHTML = taskCard(t);
      const updated = newCard.firstElementChild;
      card.replaceWith(updated);
      initDrag();
    }
  }
}

// ── ALERTS BANNER ─────────────────────
function renderAlerts(visible) {
  const container = document.getElementById('alertContainer');
  const overdue   = visible.filter(t => overdueStatus(t) === 'overdue');

  if (!overdue.length) { container.innerHTML = ''; return; }

  const items = overdue.map(t => {
    const limit = OVERDUE_BDAYS[t.prio];
    return `<li>${escHtml(t.title)} <em style="opacity:.7">(${ageLabel(t.createdAt)}, limite: ${limit} dia${limit > 1 ? 's' : ''} útil${limit > 1 ? 'eis' : ''})</em></li>`;
  }).join('');

  container.innerHTML = `<div class="alert-banner overdue">
    <div class="alert-icon">&#9888;</div>
    <div class="alert-content">
      <span class="alert-title">${overdue.length} tarefa${overdue.length > 1 ? 's' : ''} sem conclusão fora do prazo</span>
      <ul class="alert-list">${items}</ul>
    </div>
  </div>`;
}

// ── RENDER ────────────────────────────
function render() {
  const container = document.getElementById('taskContainer');

  let visible;
  if      (filter === 'done')     visible = tasks.filter(t => t.done);
  else if (filter === 'trabalho') visible = tasks.filter(t => t.cat === 'trabalho' && !t.done);
  else if (filter === 'saude')    visible = tasks.filter(t => t.cat === 'saude'    && !t.done);
  else if (filter === 'pessoal')  visible = tasks.filter(t => t.cat === 'pessoal'  && !t.done);
  else if (filter === 'urgente')  visible = tasks.filter(t => t.prio === 'urgente' && !t.done);
  else                            visible = tasks.filter(t => !t.done);

  // Stats
  const total   = tasks.length;
  const done    = tasks.filter(t => t.done).length;
  const pending = total - done;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent    = done;

  ['sb','dr'].forEach(p => {
    const lbl  = document.getElementById(`${p}ProgressLabel`);
    const fill = document.getElementById(`${p}ProgressFill`);
    if (lbl)  lbl.textContent    = `${done} de ${total} concluídas`;
    if (fill) fill.style.width   = total ? `${(done/total)*100}%` : '0%';
  });

  // Alerts
  document.getElementById('alertContainer').innerHTML = '';

  // Empty
  if (!visible.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">&#10003;</div>
      <p>Nenhuma tarefa aqui.</p>
    </div>`;
    return;
  }

  if (filter === 'done') {
    container.innerHTML = `<div class="task-list" data-prio="done">${visible.map(taskCard).join('')}</div>`;
    return;
  }

  const prioOrder = ['urgente','normal','depois'];
  const prioLabel = { urgente:'Urgente', normal:'Normal', depois:'Depois' };
  let html = '<div class="task-groups">';
  prioOrder.forEach(prio => {
    const group = visible.filter(t => t.prio === prio);
    if (!group.length) return;
    html += `<div>
      <div class="group-label ${prio}">${prioLabel[prio]}</div>
      <div class="task-list" data-prio="${prio}">${group.map(taskCard).join('')}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;

  initDrag();
}

// ── DRAG AND DROP ─────────────────────
let dragId   = null;
let dragPrio = null;
let touchY   = 0;
let ghostEl  = null;

function initDrag() {
  document.querySelectorAll('.task-list').forEach(list => {
    list.querySelectorAll('.task-card').forEach(card => {
      if (card.classList.contains('done')) return;
      const handle = card.querySelector('.drag-handle');
      if (!handle) return;

      // Desktop
      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        startDrag(card);
      });

      // Touch
      handle.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        touchY = touch.clientY;
        startDrag(card);
      }, { passive: true });
    });
  });
}

function startDrag(card) {
  dragId   = parseInt(card.dataset.id);
  dragPrio = card.closest('.task-list').dataset.prio;
  card.classList.add('dragging');

  const onMove = (clientY) => {
    // find card under cursor in same list
    const list = document.querySelector(`.task-list[data-prio="${dragPrio}"]`);
    if (!list) return;
    const siblings = [...list.querySelectorAll('.task-card:not(.dragging)')];
    let target = null;
    let before = true;
    for (const s of siblings) {
      const rect = s.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      if (clientY < mid) { target = s; before = true; break; }
      else { target = s; before = false; }
    }
    // highlight
    list.querySelectorAll('.drop-line').forEach(l => l.remove());
    if (target) {
      const line = document.createElement('div');
      line.className = 'drop-line show';
      if (before) target.before(line);
      else        target.after(line);
    }
  };

  const onEnd = (clientY) => {
    const card = document.querySelector(`.task-card[data-id="${dragId}"]`);
    if (card) card.classList.remove('dragging');

    const list = document.querySelector(`.task-list[data-prio="${dragPrio}"]`);
    list?.querySelectorAll('.drop-line').forEach(l => l.remove());

    // compute new order for this prio group
    if (list) {
      const siblings = [...list.querySelectorAll('.task-card:not(.dragging)')];
      let insertBeforeId = null;
      for (const s of siblings) {
        const rect = s.getBoundingClientRect();
        const mid  = rect.top + rect.height / 2;
        if (clientY < mid) { insertBeforeId = parseInt(s.dataset.id); break; }
      }
      reorder(dragId, dragPrio, insertBeforeId);
    }

    dragId = null; dragPrio = null;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',   onMouseUp);
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend',  onTouchEnd);
  };

  const onMouseMove = e => onMove(e.clientY);
  const onMouseUp   = e => onEnd(e.clientY);
  const onTouchMove = e => { touchY = e.touches[0].clientY; onMove(touchY); };
  const onTouchEnd  = () => onEnd(touchY);

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
  document.addEventListener('touchmove', onTouchMove, { passive: true });
  document.addEventListener('touchend',  onTouchEnd);
}

function reorder(movedId, prio, insertBeforeId) {
  // separate this prio group from the rest
  const group   = tasks.filter(t => t.prio === prio && !t.done);
  const others  = tasks.filter(t => !(t.prio === prio && !t.done));

  const moved   = group.find(t => t.id === movedId);
  const without = group.filter(t => t.id !== movedId);

  let newGroup;
  if (insertBeforeId === null) {
    newGroup = [...without, moved];
  } else {
    const idx = without.findIndex(t => t.id === insertBeforeId);
    if (idx === -1) newGroup = [...without, moved];
    else { without.splice(idx, 0, moved); newGroup = without; }
  }

  // rebuild tasks preserving original order of other groups
  // slot newGroup back where the original group was (by first occurrence)
  const result = [];
  const groupIds = new Set(group.map(t => t.id));
  let injected = false;
  for (const t of tasks) {
    if (groupIds.has(t.id) && !t.done) {
      if (!injected) { result.push(...newGroup); injected = true; }
    } else {
      result.push(t);
    }
  }
  tasks = result;
  save(); render();
}

// ── EDIT MODAL ────────────────────────
let editingId  = null;
let editCat    = 'trabalho';
let editPrio   = 'urgente';
let editCl     = []; // [{text, done}]

function renderEditCl() {
  const container = document.getElementById('editChecklist');
  if (!editCl.length) { container.innerHTML = ''; return; }
  container.innerHTML = editCl.map((item, idx) => `
    <div class="cl-edit-item">
      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="editCl[${idx}].done=this.checked">
      <span>${escHtml(item.text)}</span>
      <button class="cl-del" onclick="removeEditClItem(${idx})">&#x2715;</button>
    </div>`).join('');
}

function addEditClItem() {
  const inp = document.getElementById('editClInput');
  const txt = inp.value.trim();
  if (!txt) return;
  editCl.push({ text: txt, done: false });
  inp.value = '';
  renderEditCl();
  inp.focus();
}

function removeEditClItem(idx) {
  editCl.splice(idx, 1);
  renderEditCl();
}

function openEdit(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingId = id;
  editCat   = t.cat;
  editPrio  = t.prio;
  editCl    = (t.checklist || []).map(i => ({ ...i }));

  document.getElementById('editTitle').value = t.title;
  document.getElementById('editDesc').value  = t.desc || '';
  document.getElementById('editSubcat').value = t.subcat || '';
  document.getElementById('editClInput').value = '';

  document.querySelectorAll('#editModal .cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#editModal .cat-btn[data-cat="${t.cat}"]`).classList.add('active');

  document.querySelectorAll('#editModal .prio-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#editModal .prio-btn[data-prio="${t.prio}"]`).classList.add('active');

  updateEditSubcat(t.cat, t.subcat);
  renderEditCl();

  document.getElementById('editModal').classList.add('open');
  setTimeout(() => document.getElementById('editTitle').focus(), 100);
}

function updateEditSubcat(cat, val) {
  const wrap  = document.getElementById('editSubcatWrap');
  const input = document.getElementById('editSubcat');
  const label = document.getElementById('editSubcatLabel');
  if (cat === 'pessoal') {
    wrap.classList.add('hidden');
    input.value = '';
  } else {
    wrap.classList.remove('hidden');
    label.textContent = cat === 'trabalho' ? 'Subcategoria de Trabalho' : 'Subcategoria de Saúde';
    input.placeholder = cat === 'trabalho' ? 'ex: CRZLabs, PI Planning...' : 'ex: Nutrição, Treino, Consulta...';
    if (val !== undefined) input.value = val || '';
  }
}

function editSelectCat(cat) {
  editCat = cat;
  document.querySelectorAll('#editModal .cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#editModal .cat-btn[data-cat="${cat}"]`).classList.add('active');
  updateEditSubcat(cat);
}

function editSelectPrio(prio) {
  editPrio = prio;
  document.querySelectorAll('#editModal .prio-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`#editModal .prio-btn[data-prio="${prio}"]`).classList.add('active');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  const t = tasks.find(t => t.id === editingId);
  if (!t) return;
  const title = document.getElementById('editTitle').value.trim();
  if (!title) {
    const el = document.getElementById('editTitle');
    el.style.borderColor = 'var(--urgente)';
    el.focus();
    setTimeout(() => el.style.borderColor = '', 1200);
    return;
  }
  t.title     = title;
  t.desc      = document.getElementById('editDesc').value.trim();
  t.subcat    = editCat !== 'pessoal' ? (document.getElementById('editSubcat').value.trim() || null) : null;
  t.cat       = editCat;
  t.prio      = editPrio;
  t.checklist = editCl.map(i => ({ ...i }));
  closeEdit();
  save(); render();
}

// close on overlay click
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeEdit();
});

// close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEdit();
});

document.getElementById('editTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEdit();
});


// ── EXPORT / IMPORT ───────────────────
function showToast(msg, duration = 2400) {
  const t = document.getElementById('syncToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function exportData() {
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    tasks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href     = url;
  a.download = `agenda-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${tasks.length} tarefa${tasks.length !== 1 ? 's' : ''} exportada${tasks.length !== 1 ? 's' : ''}`);
}

function triggerImport() {
  document.getElementById('importFile').value = '';
  document.getElementById('importFile').click();
}

let pendingImport = [];

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const imported = Array.isArray(data) ? data : (data.tasks || []);
      if (!imported.length) { showToast('Nenhuma tarefa encontrada no arquivo'); return; }
      pendingImport = imported;
      const existingIds = new Set(tasks.map(t => t.id));
      const newOnes = imported.filter(t => !existingIds.has(t.id)).length;
      const dupOnes = imported.length - newOnes;
      document.getElementById('importModalDesc').innerHTML =
        `O arquivo tem <strong>${imported.length} tarefa${imported.length !== 1 ? 's' : ''}</strong>.<br>` +
        `${newOnes} nova${newOnes !== 1 ? 's' : ''}, ${dupOnes} já exist${dupOnes !== 1 ? 'em' : 'e'} aqui.<br><br>` +
        `<strong>Mesclar</strong> adiciona só as novas. <strong>Substituir</strong> apaga tudo e usa o arquivo.`;
      document.getElementById('importModal').classList.add('open');
    } catch {
      showToast('Arquivo inválido');
    }
  };
  reader.readAsText(file);
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('open');
  pendingImport = [];
}

function confirmImport(mode) {
  const existingIds = new Set(tasks.map(t => t.id));
  if (mode === 'replace') {
    tasks = pendingImport;
    showToast(`${tasks.length} tarefa${tasks.length !== 1 ? 's' : ''} importada${tasks.length !== 1 ? 's' : ''}`);
  } else {
    const newOnes = pendingImport.filter(t => !existingIds.has(t.id));
    tasks = [...tasks, ...newOnes];
    showToast(`${newOnes.length} tarefa${newOnes.length !== 1 ? 's' : ''} nova${newOnes.length !== 1 ? 's' : ''} adicionada${newOnes.length !== 1 ? 's' : ''}`);
  }
  closeImportModal();
  save(); render();
}

document.getElementById('importModal').addEventListener('click', e => {
  if (e.target === document.getElementById('importModal')) closeImportModal();
});

setInterval(render, 60 * 1000);

// Init
selectCat('trabalho', 'sb');
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  const swCode = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => clients.claim());
self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
