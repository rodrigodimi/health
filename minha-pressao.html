<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pressão Arterial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1117; --surface: #161b27; --surface2: #1c2333; --border: #21283a;
  --accent: #3b82f6; --accent2: #06b6d4; --warn: #f59e0b; --danger: #ef4444;
  --ok: #10b981; --text: #e6edf3; --muted: #7d8590;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.brand-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.brand-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* PAGE NAV */
.page-nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.nav-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  height: 38px; padding: 0 16px; border-radius: 8px;
  font-size: 18px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.nav-btn:active { background: var(--border); }
.nav-btn:disabled { opacity: 0.25; }
.page-range {
  font-size: 12px; color: var(--accent2);
  font-family: var(--mono); text-align: center; flex: 1;
  line-height: 1.4;
}

/* SCROLLABLE CONTENT */
.content {
  padding: 12px 14px 140px;
  display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto;
}

/* DAY CARD */
.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.day-card.is-today { border-color: var(--accent); }

.day-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.day-info { display: flex; align-items: baseline; gap: 8px; }
.day-number { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.is-today .day-number { color: var(--accent); }
.day-weekday { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.today-pill {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  background: var(--accent); color: #fff;
  padding: 3px 8px; border-radius: 20px;
}

/* PERIODS inside card */
.periods-row { display: grid; grid-template-columns: repeat(3, 1fr); }
.period-block {
  padding: 12px 10px;
  border-right: 1px solid var(--border);
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
  min-height: 70px;
}
.period-block:last-child { border-right: none; }
.period-block:active { background: var(--surface2); }
.period-block.active-sel { background: rgba(59,130,246,0.07); }
.period-block.active-sel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent); border-radius: 2px;
}
.period-name {
  font-size: 9px; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 4px;
}
.period-icon { font-size: 10px; }

.reading-item { margin-bottom: 6px; }
.reading-bp {
  font-family: var(--mono); font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.reading-bp.ok { color: var(--ok); }
.reading-bp.warn { color: var(--warn); }
.reading-bp.danger { color: var(--danger); }
.reading-meta {
  font-size: 9px; color: var(--muted); font-family: var(--mono);
  margin-top: 1px; display: flex; align-items: center; gap: 4px;
}
.del-btn {
  background: none; border: none; color: var(--border);
  font-size: 14px; cursor: pointer; padding: 0 2px;
  line-height: 1; transition: color 0.15s; flex-shrink: 0;
}
.del-btn:active { color: var(--danger); }

.no-reading-txt { font-size: 11px; color: var(--border); font-family: var(--mono); }

/* BOTTOM SHEET */
.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(16px + var(--safe-bottom));
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
  transform: translateY(0);
  transition: transform 0.3s ease;
}
.bottom-sheet.collapsed { transform: translateY(calc(100% - 72px)); }

.sheet-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 14px;
  cursor: pointer;
}
.sheet-toggle {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; margin-bottom: 0;
}
.sheet-toggle-label {
  font-size: 13px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.sheet-context {
  font-size: 11px; color: var(--accent2); font-family: var(--mono);
}
.sheet-arrow { font-size: 14px; color: var(--muted); transition: transform 0.2s; }
.bottom-sheet.collapsed .sheet-arrow { transform: rotate(180deg); }

.sheet-body { margin-top: 16px; }

.period-selector {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px;
}
.period-sel-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 10px 4px; border-radius: 10px; cursor: pointer;
  font-size: 11px; font-family: var(--sans); font-weight: 500;
  text-align: center; transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.period-sel-btn .btn-icon { font-size: 16px; }
.period-sel-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.period-sel-btn:active { opacity: 0.8; }

.inputs-row {
  display: grid; grid-template-columns: 1fr 24px 1fr 1fr; gap: 8px;
  align-items: center; margin-bottom: 12px;
}
.sep { text-align: center; font-size: 20px; color: var(--muted); font-weight: 300; }
input[type="number"] {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: var(--mono); font-size: 22px; font-weight: 500;
  padding: 12px 8px; width: 100%; text-align: center; outline: none;
  transition: border-color 0.15s; appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-color: var(--accent); }
.input-hint {
  font-size: 9px; font-family: var(--mono); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); text-align: center; margin-bottom: 4px;
}
.inputs-labels {
  display: grid; grid-template-columns: 1fr 24px 1fr 1fr; gap: 8px;
  margin-bottom: 4px;
}
.inputs-labels span { font-size: 9px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }

.btn-add {
  width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: 12px; padding: 15px;
  font-family: var(--sans); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.01em;
}
.btn-add:active { background: #2563eb; transform: scale(0.98); }

/* STATS BAR */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; padding: 12px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.stat-item { text-align: center; }
.stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.stat-val.ok { color: var(--ok); }
.stat-val.warn { color: var(--warn); }
.stat-val.danger { color: var(--danger); }
.stat-val.neutral { color: var(--text); }
.stat-lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* TOAST */
.toast {
  position: fixed; bottom: 180px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 20px;
  font-size: 12px; font-family: var(--mono);
  opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 200;
  white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-icon">❤️</div>
    <div>
      <div class="brand-title">Pressão Arterial</div>
      <div class="brand-sub">Monitor diário</div>
    </div>
  </div>
</div>

<div class="page-nav">
  <button class="nav-btn" id="btnPrev" onclick="changePage(-1)">&#8592;</button>
  <div class="page-range" id="pageRange"></div>
  <button class="nav-btn" id="btnNext" onclick="changePage(1)">&#8594;</button>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-item"><div class="stat-val neutral" id="statTotal">0</div><div class="stat-lbl">Leituras</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statDays">0</div><div class="stat-lbl">Dias</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statAvgSis">--</div><div class="stat-lbl">Méd. Sis.</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statAvgDia">--</div><div class="stat-lbl">Méd. Dia.</div></div>
</div>

<div class="content" id="content"></div>

<!-- BOTTOM SHEET -->
<div class="bottom-sheet collapsed" id="bottomSheet">
  <div class="sheet-handle" onclick="toggleSheet()"></div>
  <div class="sheet-toggle" onclick="toggleSheet()">
    <div class="sheet-toggle-label">
      ➕ Nova Leitura
      <span class="sheet-context" id="sheetContext"></span>
    </div>
    <span class="sheet-arrow">▲</span>
  </div>

  <div class="sheet-body" id="sheetBody">
    <div class="period-selector">
      <div class="period-sel-btn" id="psel-manha" onclick="selectPeriod('manha')">
        <span class="btn-icon">🌅</span> Manhã
      </div>
      <div class="period-sel-btn" id="psel-tarde" onclick="selectPeriod('tarde')">
        <span class="btn-icon">☀️</span> Tarde
      </div>
      <div class="period-sel-btn" id="psel-noite" onclick="selectPeriod('noite')">
        <span class="btn-icon">🌙</span> Noite
      </div>
    </div>

    <div class="inputs-labels">
      <span>Sistólica</span><span></span><span>Diastólica</span><span>Pulso</span>
    </div>
    <div class="inputs-row">
      <input type="number" id="inputSis" placeholder="120" min="60" max="250" inputmode="numeric">
      <div class="sep">/</div>
      <input type="number" id="inputDia" placeholder="80" min="40" max="150" inputmode="numeric">
      <input type="number" id="inputPulse" placeholder="72" min="30" max="220" inputmode="numeric">
    </div>

    <button class="btn-add" onclick="saveReading()">Salvar Leitura</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const PERIODS = ['manha','tarde','noite'];
  const PERIOD_LABELS = { manha:'Manhã', tarde:'Tarde', noite:'Noite' };
  const PERIOD_ICONS = { manha:'🌅', tarde:'☀️', noite:'🌙' };
  const MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const MONTHS_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAY_NAMES = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const today = new Date(); today.setHours(0,0,0,0);
  let pageOffset = 0;
  let selectedDay = { year: today.getFullYear(), month: today.getMonth(), day: today.getDate() };
  let selectedPeriod = autoDetectPeriod(new Date().getHours());
  let sheetOpen = false;

  function getKey(y, m, d) { return `bp_${y}_${String(m).padStart(2,'0')}_${String(d).padStart(2,'0')}`; }
  function loadDay(y, m, d) {
    try { return JSON.parse(localStorage.getItem(getKey(y,m,d))) || {manha:[],tarde:[],noite:[]}; }
    catch { return {manha:[],tarde:[],noite:[]}; }
  }
  function saveDay(y, m, d, data) { localStorage.setItem(getKey(y,m,d), JSON.stringify(data)); }

  function classify(s, d) {
    if (!s || !d) return '';
    if (s >= 140 || d >= 90) return 'danger';
    if (s >= 120 || d >= 80) return 'warn';
    return 'ok';
  }

  function autoDetectPeriod(h) {
    if (h >= 0 && h < 12) return 'manha';
    if (h >= 12 && h < 18) return 'tarde';
    return 'noite';
  }

  function getPageDays() {
    const days = [];
    const start = new Date(today);
    start.setDate(start.getDate() + pageOffset * 14);
    for (let i = 0; i < 14; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function toggleSheet() {
    sheetOpen = !sheetOpen;
    document.getElementById('bottomSheet').classList.toggle('collapsed', !sheetOpen);
  }

  function openSheet() {
    sheetOpen = true;
    document.getElementById('bottomSheet').classList.remove('collapsed');
  }

  function selectPeriod(p) {
    selectedPeriod = p;
    document.querySelectorAll('.period-sel-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('psel-' + p).classList.add('active');
    updateSheetContext();
    render();
  }

  function updateSheetContext() {
    const { year, month, day } = selectedDay;
    const dt = new Date(year, month, day);
    const label = `${String(day).padStart(2,'0')} ${MONTHS_SHORT[month]} · ${PERIOD_LABELS[selectedPeriod]}`;
    document.getElementById('sheetContext').textContent = label;
  }

  function selectCell(y, m, d, period) {
    selectedDay = { year: y, month: m, day: d };
    selectedPeriod = period;
    document.querySelectorAll('.period-sel-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('psel-' + period).classList.add('active');
    document.getElementById('inputSis').value = '';
    document.getElementById('inputDia').value = '';
    document.getElementById('inputPulse').value = '';
    updateSheetContext();
    openSheet();
    render();
    // Scroll to bottom sheet smoothly
    setTimeout(() => document.getElementById('inputSis').focus(), 350);
  }

  function render() {
    const days = getPageDays();
    const first = days[0], last = days[days.length-1];
    document.getElementById('pageRange').innerHTML =
      `${String(first.getDate()).padStart(2,'0')} ${MONTHS_SHORT[first.getMonth()]} &rarr; ${String(last.getDate()).padStart(2,'0')} ${MONTHS_SHORT[last.getMonth()]} ${last.getFullYear()}`;

    document.getElementById('btnPrev').disabled = false;
    document.getElementById('btnNext').disabled = pageOffset >= 0;

    const content = document.getElementById('content');
    content.innerHTML = '';

    let totalR = 0, sisSum = 0, diaSum = 0, daysWithData = 0;

    days.forEach(dateObj => {
      const y = dateObj.getFullYear(), m = dateObj.getMonth(), d = dateObj.getDate();
      const data = loadDay(y, m, d);
      const isToday = dateObj.getTime() === today.getTime();
      const isFuture = dateObj.getTime() > today.getTime();

      let dayHas = false;
      PERIODS.forEach(p => (data[p]||[]).forEach(r => { totalR++; sisSum+=r.sis; diaSum+=r.dia; dayHas=true; }));
      if (dayHas) daysWithData++;

      const card = document.createElement('div');
      card.className = 'day-card' + (isToday ? ' is-today' : '');

      // Header
      const hdr = document.createElement('div');
      hdr.className = 'day-card-header';
      hdr.innerHTML = `
        <div class="day-info">
          <div class="day-number">${String(d).padStart(2,'0')}</div>
          <div class="day-weekday">${MONTHS_SHORT[m]} · ${DAY_NAMES[dateObj.getDay()]}</div>
        </div>
        ${isToday ? '<div class="today-pill">Hoje</div>' : ''}
      `;
      card.appendChild(hdr);

      // Periods
      const row = document.createElement('div');
      row.className = 'periods-row';

      PERIODS.forEach(period => {
        const isSelected = selectedDay.year===y && selectedDay.month===m && selectedDay.day===d && selectedPeriod===period;
        const block = document.createElement('div');
        block.className = 'period-block' + (isSelected ? ' active-sel' : '');
        block.onclick = () => selectCell(y, m, d, period);

        const nameLine = document.createElement('div');
        nameLine.className = 'period-name';
        nameLine.innerHTML = `<span class="period-icon">${PERIOD_ICONS[period]}</span>${PERIOD_LABELS[period]}`;
        block.appendChild(nameLine);

        const readings = (data[period] || []);
        if (readings.length === 0 && !isFuture) {
          const empty = document.createElement('div');
          empty.className = 'no-reading-txt';
          empty.textContent = '--/--';
          block.appendChild(empty);
        }

        readings.forEach((r, idx) => {
          const item = document.createElement('div');
          item.className = 'reading-item';

          const bp = document.createElement('div');
          bp.className = 'reading-bp ' + classify(r.sis, r.dia);
          bp.innerHTML = `${r.sis}/${r.dia}`;

          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteReading(y,m,d,period,idx); };
          bp.appendChild(delBtn);
          item.appendChild(bp);

          if (r.time || r.pulse) {
            const meta = document.createElement('div');
            meta.className = 'reading-meta';
            if (r.time) meta.innerHTML += `⏱ ${r.time}`;
            if (r.pulse) meta.innerHTML += ` &nbsp;♥ ${r.pulse}`;
            item.appendChild(meta);
          }
          block.appendChild(item);
        });

        row.appendChild(block);
      });

      card.appendChild(row);
      content.appendChild(card);
    });

    // Stats
    document.getElementById('statTotal').textContent = totalR;
    document.getElementById('statDays').textContent = daysWithData;
    if (totalR > 0) {
      const as = Math.round(sisSum/totalR), ad = Math.round(diaSum/totalR);
      const cls = classify(as, ad);
      document.getElementById('statAvgSis').textContent = as;
      document.getElementById('statAvgSis').className = 'stat-val ' + cls;
      document.getElementById('statAvgDia').textContent = ad;
      document.getElementById('statAvgDia').className = 'stat-val ' + cls;
    } else {
      document.getElementById('statAvgSis').textContent = '--';
      document.getElementById('statAvgSis').className = 'stat-val neutral';
      document.getElementById('statAvgDia').textContent = '--';
      document.getElementById('statAvgDia').className = 'stat-val neutral';
    }

    updateSheetContext();
  }

  function saveReading() {
    const now = new Date();
    const autoPeriod = autoDetectPeriod(now.getHours());
    const autoTime = now.toTimeString().slice(0,5);

    selectedPeriod = autoPeriod;
    document.querySelectorAll('.period-sel-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('psel-' + autoPeriod).classList.add('active');

    const sis = parseInt(document.getElementById('inputSis').value);
    const dia = parseInt(document.getElementById('inputDia').value);
    const pulse = parseInt(document.getElementById('inputPulse').value) || null;

    if (!sis || !dia || sis < 60 || dia < 40 || sis > 250 || dia > 150) {
      showToast('Verifique os valores', '#ef4444'); return;
    }

    const { year, month, day } = selectedDay;
    const data = loadDay(year, month, day);
    if (!data[autoPeriod]) data[autoPeriod] = [];
    data[autoPeriod].push({ sis, dia, pulse, time: autoTime });
    saveDay(year, month, day, data);

    document.getElementById('inputSis').value = '';
    document.getElementById('inputDia').value = '';
    document.getElementById('inputPulse').value = '';

    render();
    showToast(`${sis}/${dia} salvo às ${autoTime}`, '#10b981');
  }

  function deleteReading(y, m, d, period, idx) {
    const data = loadDay(y, m, d);
    if (data[period]) data[period].splice(idx, 1);
    saveDay(y, m, d, data);
    render();
    showToast('Leitura removida', '#64748b');
  }

  function changePage(dir) {
    pageOffset += dir;
    if (pageOffset > 0) pageOffset = 0;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = color || '#10b981';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // INIT
  document.getElementById('psel-' + selectedPeriod).classList.add('active');
  render();
</script>
</body>
</html>
