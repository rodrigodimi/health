<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pressão Arterial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d1117; --surface: #161b27; --surface2: #1c2333; --border: #21283a;
  --accent: #3b82f6; --accent2: #06b6d4; --warn: #f59e0b; --danger: #ef4444;
  --ok: #10b981; --text: #e6edf3; --muted: #7d8590;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { background: var(--bg); color: var(--text); font-family: var(--sans); overscroll-behavior: none; }

.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 50;
}
.brand-icon {
  width: 36px; height: 36px; border-radius: 10px; font-size: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.brand-title { font-size: 16px; font-weight: 700; }
.brand-sub { font-size: 10px; color: var(--muted); }

.page-nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 8px;
}
.nav-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  height: 38px; padding: 0 16px; border-radius: 8px; font-size: 18px;
  cursor: pointer; flex-shrink: 0;
}
.nav-btn:disabled { opacity: 0.25; }
.page-range { font-size: 12px; color: var(--accent2); font-family: var(--mono); text-align: center; flex: 1; }

.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 12px 14px; gap: 6px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.stat-item { text-align: center; }
.stat-val { font-family: var(--mono); font-size: 18px; font-weight: 500; }
.stat-val.ok { color: var(--ok); } .stat-val.warn { color: var(--warn); }
.stat-val.danger { color: var(--danger); } .stat-val.neutral { color: var(--text); }
.stat-lbl { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

.content { padding: 12px 14px 200px; display: flex; flex-direction: column; gap: 10px; }

.day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.day-card.is-today { border-color: var(--accent); }

.day-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border);
}
.day-info { display: flex; align-items: baseline; gap: 8px; }
.day-number { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.is-today .day-number { color: var(--accent); }
.day-weekday { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.today-pill { font-size: 9px; font-weight: 700; text-transform: uppercase; background: var(--accent); color: #fff; padding: 3px 8px; border-radius: 20px; }

.periods-row { display: grid; grid-template-columns: repeat(3, 1fr); }
.period-block {
  padding: 12px 10px; border-right: 1px solid var(--border);
  cursor: pointer; position: relative; min-height: 70px; transition: background 0.1s;
}
.period-block:last-child { border-right: none; }
.period-block:active { background: var(--surface2); }
.period-name { font-size: 9px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }

.reading-item { margin-bottom: 5px; }
.reading-bp { font-family: var(--mono); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.reading-bp.ok { color: var(--ok); } .reading-bp.warn { color: var(--warn); } .reading-bp.danger { color: var(--danger); }
.reading-meta { font-size: 9px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
.del-btn {
  margin-left: auto; background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 12px; cursor: pointer;
  padding: 3px 8px; border-radius: 6px; line-height: 1; flex-shrink: 0;
}
.no-reading-txt { font-size: 11px; color: var(--border); font-family: var(--mono); }

/* BOTTOM SHEET */
.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--surface); border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 0 16px calc(16px + var(--safe-bottom));
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
  transition: transform 0.3s ease;
  transform: translateY(calc(100% - 58px));
}
.bottom-sheet.open { transform: translateY(0); }

.sheet-handle-row {
  padding: 12px 0 10px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
}
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto; }
.sheet-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; padding-bottom: 14px;
}
.sheet-toggle-label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sheet-context { font-size: 11px; color: var(--accent2); font-family: var(--mono); font-weight: 400; }
.sheet-arrow { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
.bottom-sheet.open .sheet-arrow { transform: rotate(180deg); }

.period-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.period-sel-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  padding: 10px 4px; border-radius: 10px; cursor: pointer;
  font-size: 12px; font-weight: 500; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.period-sel-btn .btn-icon { font-size: 18px; }
.period-sel-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.inputs-labels { display: grid; grid-template-columns: 1fr 20px 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.inputs-labels span { font-size: 9px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }
.inputs-row { display: grid; grid-template-columns: 1fr 20px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 12px; }
.sep { text-align: center; font-size: 20px; color: var(--muted); }
input[type="number"] {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: var(--mono); font-size: 22px; font-weight: 500;
  padding: 12px 6px; width: 100%; text-align: center; outline: none;
  appearance: textfield; transition: border-color 0.15s;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-color: var(--accent); }

.btn-add {
  width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: 12px; padding: 15px; font-family: var(--sans); font-size: 15px;
  font-weight: 700; cursor: pointer;
}
.btn-add:active { opacity: 0.85; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  visibility: hidden; opacity: 0; transition: opacity 0.2s, visibility 0.2s;
}
.modal-overlay.show { visibility: visible; opacity: 1; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 28px 20px calc(28px + var(--safe-bottom));
  width: 100%; max-width: 480px;
  transform: translateY(40px); transition: transform 0.25s;
}
.modal-overlay.show .modal-box { transform: translateY(0); }
.modal-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
.modal-title { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.modal-msg { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7; margin-bottom: 24px; font-family: var(--mono); }
.modal-msg strong { color: var(--text); font-weight: 600; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-cancel { padding: 14px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; }
.modal-confirm { padding: 14px; border-radius: 12px; border: none; font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; }
.modal-confirm.save { background: var(--accent); }
.modal-confirm.del { background: var(--danger); }

.toast {
  position: fixed; bottom: 220px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 20px; font-size: 12px; font-family: var(--mono);
  opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 300;
  white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="brand-icon">❤️</div>
  <div>
    <div class="brand-title">Pressão Arterial</div>
    <div class="brand-sub">Monitor diário</div>
  </div>
</div>

<div class="page-nav">
  <button class="nav-btn" id="btnPrev" onclick="changePage(-1)">&#8592;</button>
  <div class="page-range" id="pageRange"></div>
  <button class="nav-btn" id="btnNext" onclick="changePage(1)">&#8594;</button>
</div>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-val neutral" id="statTotal">0</div><div class="stat-lbl">Leituras</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statDays">0</div><div class="stat-lbl">Dias</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statAvgSis">--</div><div class="stat-lbl">Méd. Sis.</div></div>
  <div class="stat-item"><div class="stat-val neutral" id="statAvgDia">--</div><div class="stat-lbl">Méd. Dia.</div></div>
</div>

<div class="content" id="content"></div>

<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle-row" onclick="toggleSheet()">
    <div class="sheet-handle"></div>
  </div>
  <div class="sheet-toggle-row" onclick="toggleSheet()">
    <div class="sheet-toggle-label">
      ➕ Nova Leitura
      <span class="sheet-context" id="sheetContext"></span>
    </div>
    <span class="sheet-arrow">▲</span>
  </div>

  <div class="period-selector">
    <div class="period-sel-btn" id="psel-manha" onclick="selectPeriod('manha')"><span class="btn-icon">🌅</span>Manhã</div>
    <div class="period-sel-btn" id="psel-tarde" onclick="selectPeriod('tarde')"><span class="btn-icon">☀️</span>Tarde</div>
    <div class="period-sel-btn" id="psel-noite" onclick="selectPeriod('noite')"><span class="btn-icon">🌙</span>Noite</div>
  </div>

  <div class="inputs-labels">
    <span>Sistólica</span><span></span><span>Diastólica</span><span>Pulso</span>
  </div>
  <div class="inputs-row">
    <input type="number" id="inputSis" placeholder="120" min="60" max="250" inputmode="numeric">
    <div class="sep">/</div>
    <input type="number" id="inputDia" placeholder="80" min="40" max="150" inputmode="numeric">
    <input type="number" id="inputPulse" placeholder="72" min="30" max="220" inputmode="numeric">
  </div>
  <button class="btn-add" onclick="confirmarSalvar()">Salvar Leitura</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="esconderModal()">Cancelar</button>
      <button class="modal-confirm" id="modalConfirmBtn"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window.addEventListener('DOMContentLoaded', function() {

  var PERIODS = ['manha','tarde','noite'];
  var PERIOD_LABELS = { manha:'Manhã', tarde:'Tarde', noite:'Noite' };
  var PERIOD_ICONS = { manha:'🌅', tarde:'☀️', noite:'🌙' };
  var MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var DAY_NAMES = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  var today = new Date(); today.setHours(0,0,0,0);
  var pageOffset = 0;
  var sheetOpen = false;
  var pendingAction = null;

  var selectedDay = { year: today.getFullYear(), month: today.getMonth(), day: today.getDate() };
  var selectedPeriod = detectPeriod(new Date().getHours());

  // --- UTILS ---

  function detectPeriod(h) {
    if (h < 12) return 'manha';
    if (h < 18) return 'tarde';
    return 'noite';
  }

  function classify(s, d) {
    if (!s || !d) return '';
    if (s >= 140 || d >= 90) return 'danger';
    if (s >= 120 || d >= 80) return 'warn';
    return 'ok';
  }

  function getKey(y, m, d) {
    return 'bp_' + y + '_' + String(m).padStart(2,'0') + '_' + String(d).padStart(2,'0');
  }

  function loadDay(y, m, d) {
    try {
      var raw = localStorage.getItem(getKey(y,m,d));
      return raw ? JSON.parse(raw) : { manha:[], tarde:[], noite:[] };
    } catch(e) {
      return { manha:[], tarde:[], noite:[] };
    }
  }

  function saveDay(y, m, d, data) {
    localStorage.setItem(getKey(y,m,d), JSON.stringify(data));
  }

  function getPageDays() {
    var days = [];
    var start = new Date(today);
    start.setDate(start.getDate() + pageOffset * 14);
    for (var i = 0; i < 14; i++) {
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function showToast(msg, color) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.color = color || '#10b981';
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  // --- SHEET ---

  window.toggleSheet = function() {
    sheetOpen = !sheetOpen;
    document.getElementById('bottomSheet').classList.toggle('open', sheetOpen);
  };

  function openSheet() {
    sheetOpen = true;
    document.getElementById('bottomSheet').classList.add('open');
  }

  function updateSheetContext() {
    var d = selectedDay;
    document.getElementById('sheetContext').textContent =
      String(d.day).padStart(2,'0') + ' ' + MONTHS_SHORT[d.month] + ' · ' + PERIOD_LABELS[selectedPeriod];
  }

  window.selectPeriod = function(p) {
    selectedPeriod = p;
    document.querySelectorAll('.period-sel-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('psel-' + p).classList.add('active');
    updateSheetContext();
  };

  // --- MODAL ---

  function mostrarModal(icon, title, msg, confirmLabel, confirmType, onConfirm) {
    document.getElementById('modalIcon').textContent = icon;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').innerHTML = msg;
    var btn = document.getElementById('modalConfirmBtn');
    btn.textContent = confirmLabel;
    btn.className = 'modal-confirm ' + confirmType;
    pendingAction = onConfirm;
    document.getElementById('modalOverlay').classList.add('show');
  }

  window.esconderModal = function() {
    document.getElementById('modalOverlay').classList.remove('show');
    pendingAction = null;
  };

  window.fecharModal = function(e) {
    if (e.target === document.getElementById('modalOverlay')) {
      window.esconderModal();
    }
  };

  document.getElementById('modalConfirmBtn').addEventListener('click', function() {
    window.esconderModal();
    if (pendingAction) pendingAction();
  });

  // --- SALVAR ---

  window.confirmarSalvar = function() {
    var now = new Date();
    var autoPeriod = detectPeriod(now.getHours());
    var autoTime = now.toTimeString().slice(0,5);

    var sis = parseInt(document.getElementById('inputSis').value);
    var dia = parseInt(document.getElementById('inputDia').value);
    var pulse = parseInt(document.getElementById('inputPulse').value) || null;

    if (!sis || !dia || sis < 60 || dia < 40 || sis > 250 || dia > 150) {
      showToast('Verifique os valores digitados', '#ef4444');
      return;
    }

    var sd = selectedDay;
    var periodLabel = PERIOD_LABELS[autoPeriod];
    var dateLabel = String(sd.day).padStart(2,'0') + ' ' + MONTHS_SHORT[sd.month];
    var pulseInfo = pulse ? '<br>Pulso: <strong>' + pulse + ' bpm</strong>' : '';

    mostrarModal(
      '❤️',
      'Confirmar Registro',
      '<strong>' + sis + '/' + dia + ' mmHg</strong>' + pulseInfo + '<br>' + dateLabel + ' · ' + periodLabel + ' · ' + autoTime,
      'Salvar',
      'save',
      function() {
        var data = loadDay(sd.year, sd.month, sd.day);
        if (!data[autoPeriod]) data[autoPeriod] = [];
        data[autoPeriod].push({ sis: sis, dia: dia, pulse: pulse, time: autoTime });
        saveDay(sd.year, sd.month, sd.day, data);

        selectedPeriod = autoPeriod;
        document.querySelectorAll('.period-sel-btn').forEach(function(b) { b.classList.remove('active'); });
        document.getElementById('psel-' + autoPeriod).classList.add('active');

        document.getElementById('inputSis').value = '';
        document.getElementById('inputDia').value = '';
        document.getElementById('inputPulse').value = '';

        render();
        showToast(sis + '/' + dia + ' salvo às ' + autoTime, '#10b981');
      }
    );
  };

  // --- APAGAR ---

  window.confirmarApagar = function(y, m, d, period, idx) {
    var data = loadDay(y, m, d);
    var r = (data[period] || [])[idx];
    if (!r) return;

    var dateLabel = String(d).padStart(2,'0') + ' ' + MONTHS_SHORT[m];
    mostrarModal(
      '🗑️',
      'Apagar esta leitura?',
      '<strong>' + r.sis + '/' + r.dia + ' mmHg</strong><br>' + dateLabel + ' · ' + PERIOD_LABELS[period] + (r.time ? ' · ' + r.time : ''),
      'Apagar',
      'del',
      function() {
        data[period].splice(idx, 1);
        saveDay(y, m, d, data);
        render();
        showToast('Leitura removida', '#64748b');
      }
    );
  };

  // --- RENDER ---

  function render() {
    var days = getPageDays();
    var first = days[0], last = days[days.length-1];

    document.getElementById('pageRange').innerHTML =
      String(first.getDate()).padStart(2,'0') + ' ' + MONTHS_SHORT[first.getMonth()] +
      ' &rarr; ' +
      String(last.getDate()).padStart(2,'0') + ' ' + MONTHS_SHORT[last.getMonth()] + ' ' + last.getFullYear();

    document.getElementById('btnPrev').disabled = false;
    document.getElementById('btnNext').disabled = pageOffset >= 0;

    var content = document.getElementById('content');
    content.innerHTML = '';

    var totalR = 0, sisSum = 0, diaSum = 0, daysWithData = 0;

    days.forEach(function(dateObj) {
      var y = dateObj.getFullYear(), m = dateObj.getMonth(), d = dateObj.getDate();
      var data = loadDay(y, m, d);
      var isToday = dateObj.getTime() === today.getTime();
      var isFuture = dateObj.getTime() > today.getTime();

      var dayHas = false;
      PERIODS.forEach(function(p) {
        (data[p] || []).forEach(function(r) { totalR++; sisSum += r.sis; diaSum += r.dia; dayHas = true; });
      });
      if (dayHas) daysWithData++;

      var card = document.createElement('div');
      card.className = 'day-card' + (isToday ? ' is-today' : '');

      var hdr = document.createElement('div');
      hdr.className = 'day-card-header';
      hdr.innerHTML =
        '<div class="day-info">' +
          '<div class="day-number">' + String(d).padStart(2,'0') + '</div>' +
          '<div class="day-weekday">' + MONTHS_SHORT[m] + ' · ' + DAY_NAMES[dateObj.getDay()] + '</div>' +
        '</div>' +
        (isToday ? '<div class="today-pill">Hoje</div>' : '');
      card.appendChild(hdr);

      var row = document.createElement('div');
      row.className = 'periods-row';

      PERIODS.forEach(function(period) {
        var block = document.createElement('div');
        block.className = 'period-block';
        block.onclick = function() {
          selectedDay = { year: y, month: m, day: d };
          selectPeriod(period);
          document.getElementById('inputSis').value = '';
          document.getElementById('inputDia').value = '';
          document.getElementById('inputPulse').value = '';
          openSheet();
        };

        var nameLine = document.createElement('div');
        nameLine.className = 'period-name';
        nameLine.textContent = PERIOD_ICONS[period] + ' ' + PERIOD_LABELS[period];
        block.appendChild(nameLine);

        var readings = data[period] || [];
        if (readings.length === 0 && !isFuture) {
          var empty = document.createElement('div');
          empty.className = 'no-reading-txt';
          empty.textContent = '--/--';
          block.appendChild(empty);
        }

        readings.forEach(function(r, idx) {
          var item = document.createElement('div');
          item.className = 'reading-item';

          var bp = document.createElement('div');
          bp.className = 'reading-bp ' + classify(r.sis, r.dia);

          var valSpan = document.createElement('span');
          valSpan.textContent = r.sis + '/' + r.dia;
          bp.appendChild(valSpan);

          var delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '×';
          (function(cy, cm, cd, cp, ci) {
            delBtn.onclick = function(e) {
              e.stopPropagation();
              confirmarApagar(cy, cm, cd, cp, ci);
            };
          })(y, m, d, period, idx);
          bp.appendChild(delBtn);
          item.appendChild(bp);

          if (r.time || r.pulse) {
            var meta = document.createElement('div');
            meta.className = 'reading-meta';
            var parts = [];
            if (r.time) parts.push('⏱ ' + r.time);
            if (r.pulse) parts.push('♥ ' + r.pulse);
            meta.textContent = parts.join('  ');
            item.appendChild(meta);
          }

          block.appendChild(item);
        });

        row.appendChild(block);
      });

      card.appendChild(row);
      content.appendChild(card);
    });

    // Stats
    document.getElementById('statTotal').textContent = totalR;
    document.getElementById('statDays').textContent = daysWithData;
    if (totalR > 0) {
      var as = Math.round(sisSum/totalR), ad = Math.round(diaSum/totalR);
      var cls = classify(as, ad);
      document.getElementById('statAvgSis').textContent = as;
      document.getElementById('statAvgSis').className = 'stat-val ' + cls;
      document.getElementById('statAvgDia').textContent = ad;
      document.getElementById('statAvgDia').className = 'stat-val ' + cls;
    } else {
      document.getElementById('statAvgSis').textContent = '--';
      document.getElementById('statAvgSis').className = 'stat-val neutral';
      document.getElementById('statAvgDia').textContent = '--';
      document.getElementById('statAvgDia').className = 'stat-val neutral';
    }

    updateSheetContext();
  }

  window.changePage = function(dir) {
    pageOffset += dir;
    if (pageOffset > 0) pageOffset = 0;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // INIT
  document.getElementById('psel-' + selectedPeriod).classList.add('active');
  updateSheetContext();
  render();

}); // end DOMContentLoaded
</script>
</body>
</html>
